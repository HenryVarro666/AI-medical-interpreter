<svg viewBox="0 0 360 270" width="720" height="540" xmlns="http://www.w3.org/2000/svg" role="img"><style>.f-bg{fill:#f5f5f5}.f-node{fill:#ffffff;stroke:#c9c9c9}.f-hl{fill:#e1ebf4;stroke:#2f6690}.f-fillhl{fill:#2f6690}.f-fillsoft{fill:#e1ebf4}.f-bar{fill:#cfcfcf}.f-bar2{fill:#8f8f8f}.f-ln{stroke:#8f8f8f;fill:none}.f-lnhl{stroke:#2f6690;fill:none}.f-lnink{stroke:#222222;fill:none}.f-lnrule{stroke:#c9c9c9;fill:none}.f-head{fill:#8f8f8f}.f-headhl{fill:#2f6690}.f-t{fill:#222222}.f-m{fill:#7a7a7a}.f-h{fill:#2f6690}.f-onhl{fill:#ffffff}.f-dotink{fill:#222222}.f-dotm{fill:#7a7a7a}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif}</style><title>AI Medical Interpreter</title><desc>A Chinese-speaking patient and an English-speaking provider talk over the phone through Twilio and the OpenAI Realtime API; the call produces a live transcript and a SOAP note.</desc><rect x="0" y="0" width="360" height="270" rx="8" class="f-bg"/><text x="18" y="30" font-size="15" class="f-m" text-anchor="start">real-time medical phone interpretation</text><rect x="16" y="46" width="80" height="56" rx="6" class="f-node" stroke-width="1.5"/><text x="56" y="70.3" font-size="15" class="f-t" text-anchor="middle" font-weight="600">patient</text><text x="56" y="87.48" font-size="14" class="f-m" text-anchor="middle">中文</text><rect x="116" y="46" width="128" height="56" rx="6" class="f-hl" stroke-width="1.5"/><text x="180" y="69.94" font-size="14.5" class="f-h" text-anchor="middle" font-weight="600">Twilio ↔</text><text x="180" y="87.34" font-size="14.5" class="f-h" text-anchor="middle" font-weight="600">OpenAI Realtime</text><rect x="264" y="46" width="80" height="56" rx="6" class="f-node" stroke-width="1.5"/><text x="304" y="70.3" font-size="15" class="f-t" text-anchor="middle" font-weight="600">provider</text><text x="304" y="87.48" font-size="14" class="f-m" text-anchor="middle">English</text><line x1="102.3" y1="74.0" x2="111.7" y2="74.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="118.0,74.0 111.8,77.3 111.8,70.7" class="f-head"/><polygon points="96.0,74.0 102.2,70.7 102.2,77.3" class="f-head"/><line x1="248.3" y1="74.0" x2="257.7" y2="74.0" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="264.0,74.0 257.8,77.3 257.8,70.7" class="f-head"/><polygon points="242.0,74.0 248.2,70.7 248.2,77.3" class="f-head"/><line x1="160.0" y1="102.0" x2="122.7" y2="135.8" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="118.0,140.0 120.4,133.4 124.8,138.3" class="f-head"/><line x1="200.0" y1="102.0" x2="237.3" y2="135.8" class="f-ln" stroke-width="1.8" stroke-linecap="round"/><polygon points="242.0,140.0 235.2,138.3 239.6,133.4" class="f-head"/><rect x="56" y="140" width="112" height="44" rx="6" class="f-node" stroke-width="1.5"/><text x="112" y="166.64" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">live transcript</text><rect x="192" y="140" width="112" height="44" rx="6" class="f-node" stroke-width="1.5"/><text x="248" y="166.64" font-size="14.5" class="f-t" text-anchor="middle" font-weight="600">SOAP note</text><text x="180" y="228" font-size="17" class="f-h" text-anchor="middle" font-weight="600">first audio in ~400–800 ms</text><text x="180" y="251" font-size="13.5" class="f-m" text-anchor="middle">translator and intake modes · audit log</text></svg>
