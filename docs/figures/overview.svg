<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">AI MEDICAL INTERPRETER</title><desc id="desc">Two languages, one phone call. Chinese–English medical interpretation over the phone, in real time.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#EFF3F7"/></linearGradient></defs><rect width="1600" height="960" fill="url(#paper)"/><g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="1600" height="9" rx="0" fill="#007F78" stroke="none"/>
<text x="64" y="66" font-size="20" fill="#172837" font-weight="700" letter-spacing="2" data-maxx="900">AI MEDICAL INTERPRETER</text>
<text x="1536" y="66" font-size="16" fill="#007F78" font-weight="600" letter-spacing="1" text-anchor="end">REAL-TIME SPEECH / HEALTHCARE</text>
<text x="60" y="167" font-size="72" fill="#142638" font-weight="500" data-maxx="1540">Two languages, one phone call.</text>
<text x="64" y="221" font-size="27" fill="#344C5F" font-weight="400" data-maxx="1536">Chinese–English medical interpretation over the phone, in real time.</text>
<text x="64" y="262" font-size="20" fill="#697988" font-weight="400" data-maxx="1536">Twilio Media Streams and the OpenAI Realtime API, with a live dashboard and SOAP notes.</text>
<rect x="64" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="88" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="88" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="394">01 / CALL</text>
<text x="88" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="394">Phone in</text>
<text x="88" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Twilio number + webhook</text>
<text x="88" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Translator or intake mode</text>
<text x="88" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Call guard on every call</text>
<path d="M416 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="440" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="464" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="464" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="770">02 / STREAM</text>
<text x="464" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="770">No transcoding</text>
<text x="464" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">G.711 µ-law, 8 kHz both ways</text>
<text x="464" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Base64 frames passed through</text>
<text x="464" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">One WebSocket per side</text>
<path d="M792 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="816" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="840" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="840" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="1146">03 / INTERPRET</text>
<text x="840" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1146">Realtime model</text>
<text x="840" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">ASR, translation and TTS</text>
<text x="840" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Echo gate between turns</text>
<text x="840" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1146">Structured intake interview</text>
<path d="M1168 458h16m-6-6 6 6-6 6" fill="none" stroke="#007F78" stroke-width="2"/>
<rect x="1192" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="1216" y="349" width="44" height="5" rx="2" fill="#007F78" stroke="none"/>
<text x="1216" y="393" font-size="17" fill="#007F78" font-weight="700" letter-spacing="1.4" data-maxx="1522">04 / DOCUMENT</text>
<text x="1216" y="441" font-size="28" fill="#172C3C" font-weight="600" data-maxx="1522">After the call</text>
<text x="1216" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Live bilingual transcript</text>
<text x="1216" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">SOAP note in 5–10 seconds</text>
<text x="1216" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="1522">Symptoms, meds, allergies</text>
<rect x="64" y="635" width="470" height="211" rx="18" fill="#DDF3EA" stroke="none"/>
<text x="88" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="516">LATENCY</text>
<text x="88" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="516">First token in a few hundred ms</text>
<text x="88" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="516">Estimate, vs 2–4 s for Whisper → GPT → TTS.</text>
<text x="88" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="516">No resampling anywhere in the path.</text>
<rect x="565" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="589" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="1017">CALL GUARD</text>
<text x="589" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1017">Every call stays bounded</text>
<text x="589" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">Concurrency and per-number rate limits;</text>
<text x="589" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">30-min cap and 120 s silence end the call.</text>
<rect x="1066" y="635" width="470" height="211" rx="18" fill="#E8EDF3" stroke="none"/>
<text x="1090" y="675" font-size="15" fill="#007F78" font-weight="700" letter-spacing="1.2" data-maxx="1518">ACCESS</text>
<text x="1090" y="722" font-size="24" fill="#193346" font-weight="600" data-maxx="1518">Token-gated, every access logged</text>
<text x="1090" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">Dashboard and API need DASHBOARD_TOKEN;</text>
<text x="1090" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1518">Twilio signatures checked; JSONL audit.</text>
<path d="M64 888h1472" stroke="#CED9E3"/>
<text x="64" y="923" font-size="17" fill="#647788" font-weight="400" data-maxx="1536">NODE.JS ≥ 20  /  Needs OPENAI_API_KEY and DASHBOARD_TOKEN; live calls need a Twilio number and ngrok.</text>
</g></svg>
